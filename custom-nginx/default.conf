# Слабкі мережі: gzip для текстових форматів (nginx за замовчуванням стискає тільки html).
# Агресивні рівні тут не потрібні: CPU контейнера на NAS — не для компресії на максімумі.
# gzip_static не вмикаємо: .gz-предижати в bind-mount папці засмітили б канон.
server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
