<title>BG DEMO — variant B (monitor + keyboard scene)</title>
<!-- NAS-ONLY демо для вибору варіанта фону (2026-09-09). НЕ синхронізувати в CF-репо:

<style>
  html, body { margin: 0; min-height: 100%; background: #0a0a10; }
  #bg-scene { position: fixed; inset: 0; z-index: 0; }
  #bg-scene canvas { display: block; }
  #bg-fallback {
    position: fixed; inset: 0; z-index: 0; display: none; place-items: center;
    background: radial-gradient(80% 80% at 50% 30%, #16161f, #0a0a10);
    color: #9aa; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .demo-ui {

    color: #fff; font-family: "Inter Tight", -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .demo-badge {
    display: inline-block; padding: 6px 14px; border: 1px solid rgba(255,255,255,.25);
    border-radius: 999px; font-size: 12px; letter-spacing: .08em; color: #cdd3e0;
    background: rgba(10,10,16,.55); backdrop-filter: blur(8px);
  }
  .demo-h1 { font-size: clamp(28px, 5vw, 52px); line-height: 1.05; margin: 18px 0 10px; max-width: 560px; }
  .demo-p { color: #b9c0cf; max-width: 440px; line-height: 1.6; }
  .demo-actions { margin-top: 22px; display: flex; gap: 12px; flex-wrap: wrap; }
  .demo-btn {
    padding: 12px 22px; border-radius: 14px; text-decoration: none; font-weight: 600;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); color: #fff;
    backdrop-filter: blur(10px);
  }
  .demo-btn:hover { background: rgba(255,255,255,.14); }
</style>
</head>
<body>
  <div id="bg-scene"></div>
  <div id="bg-fallback"><span>WebGL недоступний — статичний фолбек</span></div>

  <div class="demo-ui">
    <span class="demo-badge">BG DEMO · VARIANT B · NAS-ONLY</span>
    <h1 class="demo-h1">Remove or recover any Dell BIOS password</h1>
    <p class="demo-p">Сцена «монітор + клавіатура»: переливи — вміст екрана, світлова пляма — на підлозі. Текст зліва — перевірка читабельності над сценою.</p>
    <div class="demo-actions">
      <a class="demo-btn" href="./">← Back to canonical (variant A)</a>
    </div>
  </div>

  <script type="module" src="assets/js/bg-scene.js?v=20260909c"></script>
